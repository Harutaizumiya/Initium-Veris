name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend to server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      REPO_URL: https://github.com/Harutaizumiya/Initium-Veris.git
      DEPLOY_BRANCH: main
      APP_ROOT: /opt/Initium-Veris
      SERVICE_NAME: initium-veris-api.service
      IMAGE_NAME: initium-veris-api:latest

    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?SERVER_HOST secret is required}"
          : "${SERVER_SSH_KEY:?SERVER_SSH_KEY secret is required}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

          GH_DEPLOY_TOKEN_B64="$(printf '%s' "$GH_DEPLOY_TOKEN" | base64 -w0)"

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "APP_ROOT='$APP_ROOT' DEPLOY_BRANCH='$DEPLOY_BRANCH' GH_DEPLOY_TOKEN_B64='$GH_DEPLOY_TOKEN_B64' IMAGE_NAME='$IMAGE_NAME' REPO_URL='$REPO_URL' SERVICE_NAME='$SERVICE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          HEALTH_URL="http://127.0.0.1:8000/api/ping"
          GH_DEPLOY_TOKEN=""

          if [ -n "${GH_DEPLOY_TOKEN_B64:-}" ]; then
            GH_DEPLOY_TOKEN="$(printf '%s' "$GH_DEPLOY_TOKEN_B64" | base64 -d 2>/dev/null || true)"
          fi

          git_auth=()
          if [ -n "$GH_DEPLOY_TOKEN" ]; then
            git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $GH_DEPLOY_TOKEN")
          fi

          if [ -d "$APP_ROOT/.git" ]; then
            git -C "$APP_ROOT" remote set-url origin "$REPO_URL"
            git "${git_auth[@]}" -C "$APP_ROOT" fetch --prune origin "$DEPLOY_BRANCH"
            git -C "$APP_ROOT" reset --hard "origin/$DEPLOY_BRANCH"
          else
            echo "$APP_ROOT is not a Git repository. Clone the repository there before deploying." >&2
            exit 1
          fi

          docker build -t "$IMAGE_NAME" "$APP_ROOT/apps/api"
          systemctl daemon-reload
          systemctl restart "$SERVICE_NAME"
          systemctl is-active --quiet "$SERVICE_NAME"

          http_status="000"
          http_body=""
          for _ in $(seq 1 20); do
            http_body="$(curl -sS -w '\n%{http_code}' "$HEALTH_URL" || true)"
            http_status="$(printf '%s' "$http_body" | tail -n 1)"
            http_body="$(printf '%s' "$http_body" | sed '$d')"
            if [ "$http_status" = "200" ] && [ "$http_body" = "pong" ]; then
              break
            fi
            sleep 1
          done

          if [ "$http_status" != "200" ] || [ "$http_body" != "pong" ]; then
            echo "Unexpected health response: status=$http_status body=$http_body" >&2
            exit 1
          fi

          echo "Deployment finished. Health response: $http_body"
          REMOTE
